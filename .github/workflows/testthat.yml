name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
####################
# versions to test #
####################
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # only test all versions of R on Ubuntu
        include:
          - os: ubuntu-22.04
            r-version: 'oldrel-2'
          - os: ubuntu-22.04
            r-version: 'oldrel-1'
          - os: ubuntu-22.04
            r-version: 'oldrel'
          - os: ubuntu-22.04
            r-version: 'release'
          - os: macos-latest
            r-version: 'release'
          - os: windows-latest
            r-version: 'release'
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      #######################
      # system dependencies #
      #######################
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libuv1-dev

      - name: Install system dependencies (windows and macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install libuv
      ##################
      # r dependencies #
      ##################
      - name: Install dependencies
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("remotes", "rcmdcheck"))
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}
        
      - name: Check
        env:
          R_PROFILE_USER: ${{ github.workspace }}/.github/.Rprofile
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--install-args=--with-keep.source"),
            error_on = "error",
            env = c(
              R_KEEP_SOURCE = "TRUE",
              R_KEEP_PKG_SOURCE = "TRUE"
            )
          )
        shell: Rscript {0}